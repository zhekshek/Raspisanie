<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Москвариум — Дежурства тренеров</title>
<style id="app-style">
  :root {
    --ink: #06283d;
    --ink-soft: #4a7390;
    --paper: #eef8fc;
    --card: #ffffff;
    --sea: #00a3d9;
    --sea-deep: #023859;
    --coral: #ff7a59;
    --line: #d2ecf5;
    --show: #b9790a;
    --show-bg: rgba(240, 180, 41, 0.16);
    --brand-deep: #012644;
    --brand-bright: #00b4e6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e8f6fc;
      --ink-soft: #8fc0d9;
      --paper: #031b2e;
      --card: #0a2f49;
      --sea: #22c0ee;
      --sea-deep: #5fe0ff;
      --line: #114866;
      --show: #ffcf5c;
      --show-bg: rgba(255, 207, 92, 0.16);
    }
  }
  :root[data-theme="dark"] {
    --ink: #e8f6fc;
    --ink-soft: #8fc0d9;
    --paper: #031b2e;
    --card: #0a2f49;
    --sea: #22c0ee;
    --sea-deep: #5fe0ff;
    --line: #114866;
    --show: #ffcf5c;
    --show-bg: rgba(255, 207, 92, 0.16);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: linear-gradient(120deg, var(--brand-deep) 0%, var(--brand-bright) 130%);
    color: #fff;
    padding: 14px 18px 0;
  }
  header .brand {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    font-weight: 600;
    margin: 2px 0 2px 0;
    letter-spacing: 0.2px;
  }
  header .date { font-size: 13px; opacity: 0.85; padding-bottom: 12px; }
  header .wave { display: block; width: 100%; height: 16px; margin-top: 10px; }
  header .wave path { fill: var(--paper); }
  main { max-width: 720px; margin: 0 auto; padding: 16px 14px 40px; }
  section { margin-bottom: 22px; }
  h2 {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 10px 2px;
    font-weight: 600;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .trainer-row {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
  }
  .trainer-row:last-child { border-bottom: none; }
  .name-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .name-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .name-toggle.active { background: var(--sea); border-color: var(--sea); color: #fff; }
  .name-text { font-size: 15px; }
  .trainer-count { font-size: 12px; color: var(--ink-soft); min-width: 16px; text-align: right; }
  .name-toggle.active .trainer-count { color: rgba(255,255,255,0.85); }
  .trainer-sub { display: flex; gap: 18px; margin-top: 8px; padding-left: 4px; }
  .show-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .switch.show-switch input:checked + .slider { background: var(--show); }
  .switch.duty-switch input:checked + .slider { background: var(--coral); }
  .mode-row { display: flex; align-items: center; justify-content: space-between; }
  .mode-label { font-size: 15px; font-weight: 600; }
  .training-times { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .training-time { display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; color: var(--ink-soft); }
  .training-time select {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 13.5px;
  }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: var(--line);
    border-radius: 20px;
    transition: background 0.15s;
    cursor: pointer;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 18px; height: 18px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.15s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .switch input:checked + .slider { background: var(--sea); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .actions { display: flex; gap: 10px; }
  button.big {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px 10px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
  }
  button.fill { background: var(--sea); }
  button.clear { background: var(--coral); }
  button.copy { background: var(--sea-deep); }
  button.big:disabled { opacity: 0.55; }
  button.big:active { transform: scale(0.98); }
  .status { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; min-height: 16px; text-align: center; }
  table.duty { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.duty th {
    background: var(--sea-deep);
    color: #fff;
    font-weight: 600;
    padding: 8px 4px;
    font-size: 12.5px;
    position: sticky;
    top: 0;
  }
  table.duty td { border-bottom: 1px solid var(--line); padding: 0; text-align: center; }
  table.duty td.time {
    color: var(--ink-soft);
    font-size: 12px;
    padding: 8px 4px;
    white-space: nowrap;
    background: var(--card);
    text-align: left;
    padding-left: 10px;
  }
  table.duty td.time .tag { display: block; font-size: inherit; color: var(--sea); }
  tr.show-row td { background: var(--show-bg); }
  .show-label { display: block; font-weight: 600; color: var(--show); }
  select.slot {
    width: 100%;
    height: 100%;
    min-height: 38px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 13.5px;
    text-align: center;
    text-align-last: center;
    padding: 8px 2px;
    appearance: none;
    -webkit-appearance: none;
  }
  select.slot:focus { outline: 2px solid var(--sea); outline-offset: -2px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  .readonly-note {
    background: #fff4e8;
    color: #8a5a1c;
    border: 1px solid #f0d3a8;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  footer { text-align: center; font-size: 11.5px; color: var(--ink-soft); padding: 10px 0 4px; }
</style>
</head>
<body>
<header>
  <div class="brand">🐬 Москвариум</div>
  <h1>Дежурства тренеров</h1>
  <div class="date" id="dateLabel"></div>
  <svg class="wave" viewBox="0 0 1200 20" preserveAspectRatio="none"><path d="M0,10 C150,20 350,0 600,10 C850,20 1050,0 1200,10 L1200,20 L0,20 Z"></path></svg>
</header>
<main>
  <div id="readonlyNote" style="display:none" class="readonly-note">Только просмотр: у вас нет прав на изменение этого расписания.</div>
  <section>
    <h2>Сегодня</h2>
    <div class="card" id="modeSection" style="padding:12px 14px;"></div>
  </section>
  <section>
    <h2>Работает сегодня</h2>
    <div class="card" id="trainerList"></div>
  </section>
  <section>
    <div class="actions">
      <button class="big fill" id="fillBtn">🎲 Заполнить</button>
      <button class="big clear" id="clearBtn">🧹 Очистить</button>
    </div>
    <div class="status" id="statusLine"></div>
  </section>
  <section>
    <h2>Время дежурств</h2>
    <div class="table-wrap">
      <table class="duty">
        <thead>
          <tr><th style="text-align:left; padding-left:10px;">Время</th><th>1</th><th>2</th><th>3</th></tr>
        </thead>
        <tbody id="dutyBody"></tbody>
      </table>
    </div>
    <button class="big copy" id="copyBtn" style="width:100%; margin-top:10px;">📋 Скопировать таблицу</button>
  </section>
  <footer>Общее расписание — изменения видят все, у кого есть ссылка</footer>
</main>
<script id="state-data" type="application/json">{"trainers":[{"name":"Женя","active":true,"onShow":false,"onDuty":false},{"name":"Настя","active":true,"onShow":false,"onDuty":false},{"name":"Никита","active":true,"onShow":false,"onDuty":false},{"name":"Юля Б","active":true,"onShow":false,"onDuty":false},{"name":"Оксана","active":true,"onShow":false,"onDuty":false},{"name":"Костя","active":true,"onShow":false},{"name":"Ксюша","active":true},{"name":"Саша","active":true},{"name":"Полина","active":true},{"name":"Аля","active":true},{"name":"Леша","active":true},{"name":"Варя","active":true},{"name":"Юля К","active":true},{"name":"Вероника","active":true},{"name":"Равшан","active":true},{"name":"Егор","active":true}],"posts":[[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null],[null,null,null]],"dayMode":"training","trainingStarts":["12:00","15:00","18:00"]}</script>
<script id="app-script">
(function () {
  var STATE = JSON.parse(document.getElementById('state-data').textContent);
  if (!STATE.dayMode) STATE.dayMode = 'show';
  if (!STATE.trainingStarts) STATE.trainingStarts = ["12:00", "15:00", "18:00"];

  var SLOTS = [
    ["9:00","9:30","Ласты"], ["9:30","10:00","Ласты"], ["10:00","10:30",""], ["10:30","11:00",""],
    ["11:00","11:30",""], ["11:30","12:00",""], ["12:00","12:30",""], ["12:30","13:00",""],
    ["13:00","13:30",""], ["13:30","14:00",""], ["14:00","14:30","Косатки"], ["14:30","15:00",""],
    ["15:00","15:30",""], ["15:30","16:00","Ласты"], ["16:00","16:30",""], ["16:30","17:00",""],
    ["17:00","17:30",""], ["17:30","18:00",""], ["18:00","18:30",""], ["18:30","19:00",""],
    ["19:00","19:30",""], ["19:30","20:00",""], ["20:00","20:30",""], ["20:30","21:00",""]
  ];
  var SLOT_START = SLOTS.map(function (s) { return s[0]; });

  // Fixed show schedule: 12:00–13:30, 15:00–16:30, 18:00–19:30
  var SHOW_ROWS = [6, 7, 8, 12, 13, 14, 18, 19, 20];

  // Rows nobody marked "дежурный" may be put into by the random fill: 19:30–20:30
  var DUTY_RESTRICTED_ROWS = [21, 22];

  function busyRows(state) {
    if (state.dayMode === 'training') {
      var set = {};
      (state.trainingStarts || []).forEach(function (t) {
        var idx = SLOT_START.indexOf(t);
        if (idx === -1) return;
        set[idx] = 1;
        if (idx + 1 < SLOTS.length) set[idx + 1] = 1;
      });
      return Object.keys(set).map(Number);
    }
    return SHOW_ROWS.slice();
  }

  function busyLabel(state) { return state.dayMode === 'training' ? '🐬 ТРЕНИРОВКА' : 'ШОУ🐬'; }
  function busyChipLabel(state) { return state.dayMode === 'training' ? 'На тренировке' : 'На ШОУ'; }

  // Static wrapper markup, hardcoded here (never derived from the live DOM,
  // so runtime-injected elements from the host can never leak into a republish).
  var HEAD_OPEN =
    '<head>\n' +
    '<meta charset="UTF-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
    '<title>Москвариум — Дежурства тренеров</title>\n';

  var BODY_SHELL =
    '<body>\n' +
    '<header>\n' +
    '  <div class="brand">🐬 Москвариум</div>\n' +
    '  <h1>Дежурства тренеров</h1>\n' +
    '  <div class="date" id="dateLabel"></div>\n' +
    '  <svg class="wave" viewBox="0 0 1200 20" preserveAspectRatio="none"><path d="M0,10 C150,20 350,0 600,10 C850,20 1050,0 1200,10 L1200,20 L0,20 Z"></path></svg>\n' +
    '</header>\n' +
    '<main>\n' +
    '  <div id="readonlyNote" style="display:none" class="readonly-note">Только просмотр: у вас нет прав на изменение этого расписания.</div>\n' +
    '  <section>\n' +
    '    <h2>Сегодня</h2>\n' +
    '    <div class="card" id="modeSection" style="padding:12px 14px;"></div>\n' +
    '  </section>\n' +
    '  <section>\n' +
    '    <h2>Работает сегодня</h2>\n' +
    '    <div class="card" id="trainerList"></div>\n' +
    '  </section>\n' +
    '  <section>\n' +
    '    <div class="actions">\n' +
    '      <button class="big fill" id="fillBtn">🎲 Заполнить</button>\n' +
    '      <button class="big clear" id="clearBtn">🧹 Очистить</button>\n' +
    '    </div>\n' +
    '    <div class="status" id="statusLine"></div>\n' +
    '  </section>\n' +
    '  <section>\n' +
    '    <h2>Время дежурств</h2>\n' +
    '    <div class="table-wrap">\n' +
    '      <table class="duty">\n' +
    '        <thead>\n' +
    '          <tr><th style="text-align:left; padding-left:10px;">Время</th><th>1</th><th>2</th><th>3</th></tr>\n' +
    '        </thead>\n' +
    '        <tbody id="dutyBody"></tbody>\n' +
    '      </table>\n' +
    '    </div>\n' +
    '    <button class="big copy" id="copyBtn" style="width:100%; margin-top:10px;">📋 Скопировать таблицу</button>\n' +
    '  </section>\n' +
    '  <footer>Общее расписание — изменения видят все, у кого есть ссылка</footer>\n' +
    '</main>\n';

  var EXTRA_OPTIONS = ["Врачи", "Ласты", "Нерпы", "Фил", "Алиса", "Рыбки"];

  function activeNames() {
    return STATE.trainers.filter(function (t) { return t.active; }).map(function (t) { return t.name; });
  }

  function onShowNames() {
    return STATE.trainers.filter(function (t) { return t.active && t.onShow; }).map(function (t) { return t.name; });
  }

  function onDutyNames() {
    return STATE.trainers.filter(function (t) { return t.active && t.onDuty; }).map(function (t) { return t.name; });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderMode(state) {
    var isTraining = state.dayMode === 'training';
    var html = '<div class="mode-row">' +
      '<span class="mode-label">' + (isTraining ? 'Тренировки' : 'Шоу🐬') + '</span>' +
      '<label class="switch mode-switch"><input type="checkbox" id="modeToggle"' + (isTraining ? ' checked' : '') + '><span class="slider"></span></label>' +
      '</div>';
    if (isTraining) {
      html += '<div class="training-times" id="trainingTimes">' + [0, 1, 2].map(function (idx) {
        var val = (state.trainingStarts || [])[idx] || '';
        var opts = SLOT_START.map(function (t) {
          return '<option value="' + t + '"' + (t === val ? ' selected' : '') + '>' + t + '</option>';
        }).join('');
        return '<label class="training-time"><span>Тренировка ' + (idx + 1) + '</span>' +
          '<select class="training-start" data-idx="' + idx + '">' + opts + '</select></label>';
      }).join('') + '</div>';
    }
    document.getElementById('modeSection').innerHTML = html;
  }

  function renderTrainers(state) {
    var counts = {};
    var names = activeNames();
    names.forEach(function (n) { counts[n] = 0; });
    state.posts.forEach(function (row) {
      row.forEach(function (name) { if (name && counts.hasOwnProperty(name)) counts[name]++; });
    });

    var chipLabel = busyChipLabel(state);

    var trainerHtml = state.trainers.map(function (t, i) {
      var cnt = t.active ? (counts[t.name] || 0) : 0;
      return '<div class="trainer-row">' +
        '<label class="name-toggle' + (t.active ? ' active' : '') + '">' +
        '<input type="checkbox" data-idx="' + i + '" class="toggle"' + (t.active ? ' checked' : '') + '>' +
        '<span class="name-text">' + escapeHtml(t.name) + '</span>' +
        '<span class="trainer-count">' + (t.active ? cnt : '') + '</span>' +
        '</label>' +
        (t.active ? '<div class="trainer-sub">' +
          '<span class="show-chip"><span>' + chipLabel + '</span><label class="switch show-switch"><input type="checkbox" class="show-toggle" data-idx="' + i + '"' + (t.onShow ? ' checked' : '') + '><span class="slider"></span></label></span>' +
          '<span class="show-chip"><span>Дежурный</span><label class="switch duty-switch"><input type="checkbox" class="duty-toggle" data-idx="' + i + '"' + (t.onDuty ? ' checked' : '') + '><span class="slider"></span></label></span>' +
          '</div>' : '') +
        '</div>';
    }).join('');

    document.getElementById('trainerList').innerHTML = trainerHtml;
  }

  function renderDuty(state) {
    var names = activeNames();
    var onShowSet = onShowNames();
    var busy = busyRows(state);
    var label = busyLabel(state);

    var bodyHtml = SLOTS.map(function (slot, r) {
      var isBusy = busy.indexOf(r) !== -1;
      var timeCell = '<td class="time' + (isBusy ? ' show-time' : '') + '">' + slot[0] + '–' + slot[1] +
        (isBusy ? '<span class="show-label">' + label + '</span>' : '') + '</td>';
      var cells = [0,1,2].map(function (c) {
        var val = state.posts[r][c];
        var pool = (isBusy ? names.filter(function (n) { return onShowSet.indexOf(n) === -1; }) : names.slice());
        var extra = EXTRA_OPTIONS.slice();
        if (val && pool.indexOf(val) === -1 && extra.indexOf(val) === -1) pool.push(val);
        var opts = '<option value=""' + (!val ? ' selected' : '') + '>—</option>';
        opts += pool.map(function (n) {
          return '<option value="' + escapeHtml(n) + '"' + (n === val ? ' selected' : '') + '>' + escapeHtml(n) + '</option>';
        }).join('');
        opts += '<optgroup label="Другое">' + extra.map(function (n) {
          return '<option value="' + escapeHtml(n) + '"' + (n === val ? ' selected' : '') + '>' + escapeHtml(n) + '</option>';
        }).join('') + '</optgroup>';
        return '<td><select class="slot" data-row="' + r + '" data-col="' + c + '">' + opts + '</select></td>';
      }).join('');
      return '<tr' + (isBusy ? ' class="show-row"' : '') + '>' + timeCell + cells + '</tr>';
    }).join('');

    document.getElementById('dutyBody').innerHTML = bodyHtml;
  }

  // Cheap path for a single slot edit: only the attendance counts change,
  // so there's no need to rebuild the whole trainer list or the 72-cell table.
  function updateCounts(state) {
    var counts = {};
    activeNames().forEach(function (n) { counts[n] = 0; });
    state.posts.forEach(function (row) {
      row.forEach(function (n) { if (n && counts.hasOwnProperty(n)) counts[n]++; });
    });
    var rows = document.querySelectorAll('#trainerList .trainer-row');
    state.trainers.forEach(function (t, i) {
      var el = rows[i] && rows[i].querySelector('.trainer-count');
      if (el) el.textContent = t.active ? (counts[t.name] || 0) : '';
    });
  }

  function render(state) {
    renderMode(state);
    renderTrainers(state);
    renderDuty(state);
    bindEvents();
  }

  // Build the FULL replacement document from known-static pieces plus the
  // current state — never from document.documentElement.outerHTML, so any
  // runtime-injected elements from the host page are never captured.
  function makePublishHtml(state) {
    var styleEl = document.getElementById('app-style');
    var scriptEl = document.getElementById('app-script');
    var styleHtml = styleEl.outerHTML;   // scoped to our own known element
    var scriptHtml = scriptEl.outerHTML; // scoped to our own known element

    return '<!doctype html>\n<html lang="ru">\n' +
      HEAD_OPEN + styleHtml + '\n</head>\n' +
      BODY_SHELL +
      '<script id="state-data" type="application/json">' + JSON.stringify(state) + '</' + 'script>\n' +
      scriptHtml + '\n' +
      '</body>\n</html>';
  }

  var claudeArtifact = null;
  var canWrite = true;
  var LOCAL_KEY = 'duty_schedule_state_v1';

  async function ensureCapability() {
    if (window.claude && window.claude.use) {
      try { claudeArtifact = await window.claude.use('artifact'); }
      catch (e) { claudeArtifact = null; }
    }
    if (!claudeArtifact) {
      // No shared storage available on this host (e.g. plain static hosting) —
      // fall back to this browser's own saved copy, if there is one.
      try {
        var saved = localStorage.getItem(LOCAL_KEY);
        if (saved) { STATE = JSON.parse(saved); render(STATE); }
      } catch (e) { /* localStorage unavailable — page still works, just won't persist */ }
    }
  }

  function setStatus(text) { document.getElementById('statusLine').textContent = text || ''; }

  function setBusy(busy) {
    document.getElementById('fillBtn').disabled = busy;
    document.getElementById('clearBtn').disabled = busy;
  }

  function markReadOnly() {
    canWrite = false;
    document.getElementById('readonlyNote').style.display = 'block';
    document.getElementById('fillBtn').disabled = true;
    document.getElementById('clearBtn').disabled = true;
    document.querySelectorAll('.toggle, .show-toggle, .duty-toggle, #modeToggle, .training-start, select.slot').forEach(function (el) { el.disabled = true; });
  }

  var pendingTimer = null;
  var PENDING_DELAY = 350;
  var saveInFlight = false;
  var dirtyState = null;

  async function saveState(newState, alreadyApplied) {
    if (!canWrite) return;
    if (!alreadyApplied) { STATE = newState; render(STATE); }

    if (saveInFlight) {
      // A save is already on the way to the server — don't fire a second
      // request on top of it (and don't touch inputs). Just remember this
      // is the freshest state, and send it the moment the current one lands.
      dirtyState = newState;
      return;
    }

    saveInFlight = true;
    setBusy(true);
    setStatus('Сохраняем…');
    if (!claudeArtifact) {
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(newState)); } catch (e) {}
      setStatus('Сохранено в этом браузере на этом устройстве.');
      setBusy(false);
      saveInFlight = false;
      return;
    }
    var html = makePublishHtml(newState);
    try {
      await claudeArtifact.publish(html);
      saveInFlight = false;
      if (dirtyState) {
        var pending = dirtyState;
        dirtyState = null;
        saveState(pending, true);
      }
      // On success the view also reloads to the new version automatically.
    } catch (err) {
      saveInFlight = false;
      var code = err && err.code;
      if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') {
        markReadOnly();
        setStatus('');
      } else if (code === 'conflict') {
        setStatus('Кто-то уже обновил расписание — обновляю…');
      } else {
        setStatus('Не удалось сохранить: ' + (err && err.message ? err.message : 'ошибка') + '. Попробуйте ещё раз.');
        setBusy(false);
      }
    }
  }

  // Applies a change to the screen instantly (no waiting for the network),
  // and folds rapid successive changes into a single save shortly after
  // the last one, so quick tapping never feels like it's hanging.
  function scheduleSave(next) {
    STATE = next;
    render(STATE);
    setStatus('');
    if (pendingTimer) clearTimeout(pendingTimer);
    pendingTimer = setTimeout(function () {
      pendingTimer = null;
      saveState(STATE, true);
    }, PENDING_DELAY);
  }

  function cloneState() { return JSON.parse(JSON.stringify(STATE)); }

  // Light-weight path for attendance/show/duty toggles: only the trainer
  // list (16 rows) is rebuilt, not the whole 72-cell duty table — that was
  // the main source of lag when tapping several names quickly.
  function scheduleSaveTrainers(next) {
    STATE = next;
    renderTrainers(STATE);
    bindEvents();
    setStatus('');
    if (pendingTimer) clearTimeout(pendingTimer);
    pendingTimer = setTimeout(function () {
      pendingTimer = null;
      saveState(STATE, true);
    }, PENDING_DELAY);
  }

  // Light-weight path for a single table-cell pick: only the attendance
  // counts actually change, so we skip rebuilding the trainer list and the
  // whole 72-cell table — the clicked <select> already shows its own value.
  function scheduleSaveLight(next) {
    STATE = next;
    updateCounts(STATE);
    setStatus('');
    if (pendingTimer) clearTimeout(pendingTimer);
    pendingTimer = setTimeout(function () {
      pendingTimer = null;
      saveState(STATE, true);
    }, PENDING_DELAY);
  }

  function bindEvents() {
    document.querySelectorAll('.toggle').forEach(function (el) {
      el.onchange = function () {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        var next = cloneState();
        next.trainers[idx].active = el.checked;
        if (!el.checked) { next.trainers[idx].onShow = false; next.trainers[idx].onDuty = false; }
        scheduleSaveTrainers(next);
      };
    });
    document.querySelectorAll('.show-toggle').forEach(function (el) {
      el.onchange = function () {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        var next = cloneState();
        next.trainers[idx].onShow = el.checked;
        scheduleSaveTrainers(next);
      };
    });
    document.querySelectorAll('.duty-toggle').forEach(function (el) {
      el.onchange = function () {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        var next = cloneState();
        next.trainers[idx].onDuty = el.checked;
        scheduleSaveTrainers(next);
      };
    });
    var modeEl = document.getElementById('modeToggle');
    if (modeEl) {
      modeEl.onchange = function () {
        var next = cloneState();
        next.dayMode = modeEl.checked ? 'training' : 'show';
        scheduleSave(next);
      };
    }
    document.querySelectorAll('.training-start').forEach(function (el) {
      el.onchange = function () {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        var next = cloneState();
        if (!next.trainingStarts) next.trainingStarts = ["12:00", "15:00", "18:00"];
        next.trainingStarts[idx] = el.value;
        scheduleSave(next);
      };
    });
    document.querySelectorAll('select.slot').forEach(function (el) {
      el.onchange = function () {
        var r = parseInt(el.getAttribute('data-row'), 10);
        var c = parseInt(el.getAttribute('data-col'), 10);
        var next = cloneState();
        next.posts[r][c] = el.value || null;
        scheduleSaveLight(next);
      };
    });
  }

  function randomFill() {
    var names = activeNames();
    if (names.length === 0) { setStatus('Нет отмеченных тренеров.'); return; }
    var onShowSet = onShowNames();
    var onDutySet = onDutyNames();

    var next = cloneState();
    var busy = busyRows(next);
    var counts = {};
    names.forEach(function (n) { counts[n] = 0; });
    next.posts.forEach(function (row) {
      row.forEach(function (n) { if (n && counts.hasOwnProperty(n)) counts[n]++; });
    });

    var relaxedUsed = false;
    var noEligible = false;

    for (var r = 0; r < next.posts.length; r++) {
      var isBusyRow = busy.indexOf(r) !== -1;
      var isDutyRestricted = DUTY_RESTRICTED_ROWS.indexOf(r) !== -1;
      var eligible = names;
      if (isBusyRow) eligible = eligible.filter(function (n) { return onShowSet.indexOf(n) === -1; });
      if (isDutyRestricted) eligible = eligible.filter(function (n) { return onDutySet.indexOf(n) === -1; });

      for (var c = 0; c < 3; c++) {
        if (next.posts[r][c]) continue;
        if (eligible.length === 0) { noEligible = true; continue; }

        var rowNames = [0,1,2].filter(function (cc) { return cc !== c; }).map(function (cc) { return next.posts[r][cc]; });

        var candidates = [];
        for (var relax = 0; relax <= 1; relax++) {
          candidates = eligible.filter(function (name) {
            if (rowNames.indexOf(name) !== -1) return false;
            if (relax === 0 && r >= 2) {
              if (next.posts[r-1][c] === name && next.posts[r-2][c] === name) return false;
            }
            return true;
          });
          if (candidates.length > 0) break;
        }

        var pick;
        if (candidates.length === 0) {
          relaxedUsed = true;
          pick = eligible[Math.floor(Math.random() * eligible.length)];
        } else {
          var minCount = Math.min.apply(null, candidates.map(function (n) { return counts[n]; }));
          var best = candidates.filter(function (n) { return counts[n] === minCount; });
          pick = best[Math.floor(Math.random() * best.length)];
        }

        next.posts[r][c] = pick;
        counts[pick] = (counts[pick] || 0) + 1;
      }
    }

    if (noEligible) setStatus('Внимание: для части времени «' + busyLabel(next) + '» не хватило свободных тренеров — ячейки оставлены пустыми.');
    if (relaxedUsed) sessionStorage.setItem('duty_relaxed_note', '1');
    saveState(next);
  }

  function clearAll() {
    var next = cloneState();
    next.posts = SLOTS.map(function () { return [null, null, null]; });
    saveState(next);
  }

  function buildCopyText() {
    var d = new Date();
    var dd = ('0' + d.getDate()).slice(-2);
    var mm = ('0' + (d.getMonth() + 1)).slice(-2);
    var yy = String(d.getFullYear()).slice(-2);
    var lines = ['Расписание на ЦП на ' + dd + '.' + mm + '.' + yy, ''];

    var busy = busyRows(STATE);
    var label = busyLabel(STATE);

    for (var i = 0; i < SLOTS.length; i += 2) {
      for (var k = i; k < Math.min(i + 2, SLOTS.length); k++) {
        var slot = SLOTS[k];
        var names = STATE.posts[k].map(function (n) { return n || '—'; }).join(', ');
        var showTag = busy.indexOf(k) !== -1 ? (label + ' ') : '';
        lines.push('✅' + slot[0] + '-' + slot[1] + ' ' + showTag + names);
      }
      lines.push('');
    }
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    return lines.join('\n');
  }

  function copyTable() {
    var text = buildCopyText();
    var btn = document.getElementById('copyBtn');
    var done = function () {
      var original = '📋 Скопировать таблицу';
      btn.textContent = '✅ Скопировано';
      setTimeout(function () { btn.textContent = original; }, 1800);
    };
    var fail = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        done();
      } catch (e) {
        setStatus('Не удалось скопировать. Выделите текст вручную.');
      }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fail);
    } else {
      fail();
    }
  }

  document.getElementById('fillBtn').addEventListener('click', randomFill);
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('copyBtn').addEventListener('click', copyTable);

  var today = new Date();
  document.getElementById('dateLabel').textContent = today.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });

  if (sessionStorage.getItem('duty_relaxed_note')) {
    setStatus('Готово. В паре ячеек не вышло соблюсти все условия — проверьте расписание.');
    sessionStorage.removeItem('duty_relaxed_note');
  }

  render(STATE);
  ensureCapability();
})();
</script>
</body>
</html>
